services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      DB_PATH: /app/data/bot.sqlite3
      GOOGLE_CREDS_PATH: /app/service_account.json
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data:/app/data
      - ./service_account.json:/app/service_account.json:ro
    command: ["python", "-m", "app.main"]
    restart: unless-stopped
